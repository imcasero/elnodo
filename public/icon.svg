<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #000000; }
    .fg { stroke: #ffffff; fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #000000; }
      .fg { stroke: #ffffff; fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="38" />
  <!-- connectors -->
  <g class="fg" stroke-width="11" stroke-linecap="round">
    <line x1="90" y1="90" x2="90" y2="34" />
    <line x1="90" y1="90" x2="40" y2="132" />
    <line x1="90" y1="90" x2="140" y2="132" />
  </g>
  <!-- outer nodes -->
  <g class="fg">
    <circle cx="90" cy="34" r="13" />
    <circle cx="40" cy="132" r="13" />
    <circle cx="140" cy="132" r="13" />
  </g>
  <!-- central node -->
  <circle cx="90" cy="90" r="24" fill="#e4f101" />
</svg>
